name: CUDL core checks

on:
  push:
    branches: ["main", "foundation/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build --sdist --wheel --outdir "$RUNNER_TEMP/cudl-dist"
      - name: Smoke-test installed wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/cudl-package-smoke"
          "$RUNNER_TEMP/cudl-package-smoke/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/cudl-dist/*.whl
          "$RUNNER_TEMP/cudl-package-smoke/bin/cudl" --help
          "$RUNNER_TEMP/cudl-package-smoke/bin/cudl" check "$GITHUB_WORKSPACE/examples/hello.cudl"
          "$RUNNER_TEMP/cudl-package-smoke/bin/cudl" check "$GITHUB_WORKSPACE/examples/hello-react-python.cudl"
          "$RUNNER_TEMP/cudl-package-smoke/bin/cudl" bundle "$GITHUB_WORKSPACE/examples/five-part-welcome.cudl" > "$RUNNER_TEMP/cudl-package-smoke-ir.json"
      - name: Validate canonical examples
        run: |
          cudl check examples/hello.cudl
          cudl check examples/hello-react-python.cudl
          cudl bundle examples/five-part-welcome.cudl > /tmp/cudl-example-ir.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build React adapter
        working-directory: adapters/react
        run: npm install && npm test
