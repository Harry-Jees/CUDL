name: CUDL core checks

on:
  push:
    branches: ["main", "foundation/**", "implementation/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Validate example
        run: cudl check examples/hello.cudl
      - name: Validate five-part application
        run: cudl bundle examples/five-part-welcome.cudl
      - name: Analyze project manifests and host stacks
        run: cudl analyze .
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build React adapter
        working-directory: adapters/react
        run: npm install && npm run build
